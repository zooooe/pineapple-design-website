const roots=[...document.querySelectorAll('svg')].filter(s=>!s.parentElement.closest('svg'));let playing=false,started=false;
function setGifPlayback(active){document.querySelectorAll('#art *').forEach(el=>{[...el.attributes].forEach(a=>{const value=active?a.value.replace(/\.gif\.poster\.png/g,'.gif'):a.value.replace(/\.gif(?!\.poster\.png)/g,'.gif.poster.png');if(value!==a.value)el.setAttribute(a.name,value)})})}
function pause(){roots.forEach(s=>s.pauseAnimations());playing=false;report()}
function play(){if(!started)setGifPlayback(true);started=true;document.querySelector('#start').hidden=true;roots.forEach(s=>s.unpauseAnimations());playing=true;report()}
function restart(){setGifPlayback(false);roots.forEach(s=>{s.pauseAnimations();s.setCurrentTime(0)});window.scrollTo(0,0);started=false;playing=false;document.querySelector('#start').hidden=false;report()}
function report(){parent.postMessage({type:'national-original-state',playing,started,time:roots[0]?.getCurrentTime()||0},location.origin)}
pause();document.querySelector('#start button').addEventListener('click',play);
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='national-original-command'){if(e.data.action==='toggle')playing?pause():play();if(e.data.action==='restart'){restart();play()}if(e.data.action==='pause')pause()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});setInterval(report,500);
</script></body></html>
